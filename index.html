<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PokerSplit</title>
  <meta name="description" content="Track home poker buy-ins, settle up in the fewest payments, and keep a record of who still owes whom.">
  <meta name="theme-color" content="#05160f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokerSplit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="chip-gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6e09a"/>
            <stop offset="0.5" stop-color="#e0b95b"/>
            <stop offset="1" stop-color="#b98a2c"/>
          </linearGradient>
          <radialGradient id="chip-body" cx="0.38" cy="0.32" r="0.8">
            <stop offset="0" stop-color="#3a3a3a"/>
            <stop offset="1" stop-color="#090909"/>
          </radialGradient>
        </defs>
        <circle cx="24" cy="24" r="23" fill="url(#chip-body)" stroke="url(#chip-gold)" stroke-width="1.2"/>
        <circle class="logo-edge" cx="24" cy="24" r="20" fill="none" stroke="url(#chip-gold)" stroke-width="5.5" stroke-dasharray="6.5 9.2"/>
        <circle cx="24" cy="24" r="15.4" fill="#111" stroke="url(#chip-gold)" stroke-width="0.9"/>
        <circle cx="24" cy="24" r="12.6" fill="none" stroke="url(#chip-gold)" stroke-width="1.1" stroke-dasharray="2.8 2.15"/>
        <path fill="url(#chip-gold)" transform="translate(16.8 16.2) scale(0.6)" d="M12 3c3 4 7 6 7 10a4 4 0 0 1-6.5 3c.3 2 1 3 2.5 4H9c1.5-1 2.2-2 2.5-4A4 4 0 0 1 5 13c0-4 4-6 7-10z"/>
      </svg>
      PokerSplit
    </h1>
    <span id="topbar-note" class="topbar-note"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" class="tab" data-action="tab" data-tab="game">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 7 6 7 10a4 4 0 0 1-6.5 3c.3 2 1 3 2.5 4H9c1.5-1 2.2-2 2.5-4A4 4 0 0 1 5 13c0-4 4-6 7-10z"/></svg>
      <span class="tab-label">Game</span>
    </button>
    <button type="button" class="tab" data-action="tab" data-tab="debts">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M15.6 9.6a5.5 5.5 0 1 1-6 6"/></svg>
      <span class="tab-label">Debts <span id="debt-badge" class="badge" hidden></span></span>
    </button>
    <button type="button" class="tab" data-action="tab" data-tab="history">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 3M16 6h3a3 3 0 0 1-3 3M12 13v4M8 20h8"/></svg>
      <span class="tab-label">History</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <input id="photo-file" type="file" accept="image/*" hidden>

  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
